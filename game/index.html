<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PERLA BAY — a 3D open-world crime game in Bahía Perla. Steal cars, outrun the police, run 8 story missions. Playable offline in a desktop browser.">
<title>PERLA BAY — Bahía Perla</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1218; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font-size: 13px; }
  .hud-panel { position: absolute; background: rgba(12, 10, 20, 0.72); border: 1px solid rgba(255, 216, 128, 0.45); border-radius: 6px; padding: 8px 10px; backdrop-filter: blur(2px); }
  .hud-mission { top: 12px; left: 12px; width: 340px; }
  .hud-mission-title { font-size: 16px; font-weight: 800; color: #ffd880; letter-spacing: 0.4px; }
  .hud-mission-stage { font-size: 11px; color: #9ec8e8; margin-top: 2px; font-weight: 700; }
  .hud-mission-timer { font-size: 12px; color: #fff; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hud-mission-objective { font-size: 12px; color: #e8e8e8; margin-top: 4px; line-height: 1.35; }
  .hud-wanted { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .hud-wanted .hud-star { color: rgba(255,255,255,0.22); }
  .hud-wanted .hud-star.lit { color: #ffd880; }
  .hud-wanted.hot .hud-star.lit { color: #ff5040; }
  .hud-top-right { top: 12px; right: 12px; text-align: right; min-width: 210px; }
  .hud-money { font-size: 20px; font-weight: 800; color: #7ae88a; }
  .hud-clock { font-size: 11px; color: #ffb060; margin-top: 2px; font-weight: 700; }
  .hud-radio { font-size: 11px; color: #e8a0d8; margin-top: 2px; }
  .hud-dispatch { top: 118px; right: 12px; width: 250px; }
  .hud-dispatch-title { font-size: 11px; font-weight: 800; color: #ff8080; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,128,128,0.35); padding-bottom: 4px; }
  .hud-dispatch-row { font-size: 11px; padding: 3px 0; font-family: Consolas, monospace; color: #ffd8d8; }
  .hud-dispatch-quiet { color: #8a8a92; }
  .hud-weapons { position: absolute; top: 130px; left: 12px; display: flex; flex-direction: column; gap: 4px; }
  .hud-weapon { background: rgba(12,10,20,0.72); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; padding: 4px 8px; font-size: 11px; display: flex; gap: 8px; }
  .hud-weapon.active { border-color: #ffd880; background: rgba(60,45,10,0.8); }
  .hud-weapon-key { color: #ffd880; font-weight: 800; }
  .hud-weapon-name { font-weight: 700; }
  .hud-weapon-ammo { color: #9ec8e8; margin-left: auto; font-family: Consolas, monospace; }
  .hud-map-wrap { position: absolute; left: 12px; bottom: 12px; text-align: center; }
  .hud-minimap { border-radius: 50%; border: 2px solid rgba(255,216,128,0.7); background: #22222c; display: block; }
  .hud-map-label { font-size: 10px; color: #ffd880; font-weight: 700; margin-top: 4px; letter-spacing: 1px; }
  .hud-vehicle { right: 12px; bottom: 12px; text-align: right; min-width: 230px; }
  .hud-speed { font-size: 34px; font-weight: 800; line-height: 1; color: #fff; display: inline-block; }
  .hud-speed-unit { display: inline-block; font-size: 12px; color: #9ec8e8; margin-left: 4px; }
  .hud-car { font-size: 13px; font-weight: 800; color: #ffd880; margin-top: 2px; }
  .hud-condition { font-size: 11px; color: #c8c8d0; }
  .hud-bars { margin-top: 6px; }
  .hud-bar { height: 10px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 3px; position: relative; overflow: hidden; }
  .hud-bar-label { position: absolute; left: 4px; top: 0; font-size: 8px; line-height: 10px; color: #fff; z-index: 1; font-weight: 700; }
  .hud-bar-fill { height: 100%; background: #4ac86a; width: 100%; }
  .hud-bar-ar .hud-bar-fill { background: #5a9ae8; }
  .hud-respect { font-size: 11px; color: #e8a0d8; font-weight: 700; margin-top: 5px; }
  .hud-dialogue { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 560px; max-width: 72vw; background: rgba(12,10,20,0.82); border: 1px solid rgba(255,216,128,0.5); border-radius: 6px; padding: 10px 14px; }
  .hud-dialogue-name { font-size: 12px; font-weight: 800; color: #ffd880; }
  .hud-dialogue-text { font-size: 14px; line-height: 1.4; margin-top: 3px; }
  .hud-toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: rgba(12,10,20,0.85); border: 1px solid #ffd880; border-radius: 4px; padding: 7px 16px; font-size: 14px; font-weight: 700; color: #ffd880; white-space: nowrap; }
  .hud-start { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,8,24,0.55), rgba(20,8,24,0.82)); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; text-align: center; }
  .hud-start-title { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ffd880; text-shadow: 0 4px 24px rgba(255,120,40,0.6); }
  .hud-start-sub { font-size: 18px; color: #ffb060; margin-top: 6px; }
  .hud-start-desc { font-size: 14px; color: #e8e8e8; max-width: 560px; margin-top: 14px; line-height: 1.5; }
  .hud-start-btn { margin-top: 26px; font-size: 20px; font-weight: 800; color: #1a1218; background: #ffd880; border: none; border-radius: 8px; padding: 14px 34px; cursor: pointer; pointer-events: auto; }
  .hud-start-btn:hover { background: #ffe8a0; }
  .hud-start-hints { font-size: 12px; color: #c8c8d0; margin-top: 18px; }
  .hud-start-save { font-size: 12px; color: #7ae88a; margin-top: 8px; }
  .hud-pause { position: absolute; inset: 0; background: rgba(10,6,14,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
  .hud-pause-title { font-size: 44px; font-weight: 900; color: #ffd880; letter-spacing: 4px; }
  .hud-pause-text { font-size: 14px; color: #e8e8e8; margin-top: 10px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
